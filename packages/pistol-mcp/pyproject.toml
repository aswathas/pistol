[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pistol-mcp"
version = "0.1.0"
description = "MCP server exposing pistol's 15 stock-market tools to any MCP client (Claude Code, Cursor, etc)."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "aswathas13" }]
keywords = ["indian-stocks", "nse", "mcp", "model-context-protocol", "finance"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Financial and Insurance Industry",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Office/Business :: Financial :: Investment",
]
dependencies = [
    "pistol>=0.1.0",
    "mcp>=1.0,<2",
]

[project.optional-dependencies]
test = ["pytest>=7.4"]

[project.scripts]
pistol-mcp = "pistol_mcp.server:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
